<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrasi Kelas - Haris DevLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #4a5b70;
      --navy-dark: #3b4a5c;
      --teal: #6aa84f;
      --teal-dark: #588a41;
      --teal-light: #eaf3e5;
      --teal-border-light: #cfe6c2;
      --teal-bg-light: #f6faf4;
      --teal-text: #ffffff;
      --border: #c9d3d6;
      --ink: #1f2a30;
      --muted: #5c6b70;
      --paper: #ffffff;
      --bg: #eef1f2;
    }

    * {
      box-sizing: border-box;
    }

    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color-adjust: exact;
    }

    body {
      margin: 0;
      font-family: 'Trebuchet MS', 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
    }

    /* ---------- MOBILE RESPONSIVE ---------- */
    @media screen and (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }
      .editor {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: none;
        overflow-y: visible;
        padding: 14px 14px 40px;
      }
      .preview-wrap {
        height: auto;
        min-height: auto;
      }
      .canvas {
        padding: 16px 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      #page-container {
        transform-origin: top left;
        max-width: 100%;
      }
      .toolbar {
        padding: 8px 10px;
        flex-wrap: wrap;
        gap: 6px;
        position: relative;
      }
      .toolbar .grp {
        font-size: 11px;
        gap: 4px;
      }
      .toolbar select {
        font-size: 11px;
        padding: 4px 6px;
      }
      .btn-print {
        position: fixed;
        top: auto !important;
        bottom: 16px;
        right: 16px;
        left: 16px;
        width: auto;
        font-size: 13px;
        padding: 12px 16px;
        border-radius: 24px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        z-index: 9999;
        white-space: nowrap;
        text-align: center;
      }
      #accountBadge {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 10px;
      }
      .row2 {
        grid-template-columns: 1fr;
      }
      .section > summary {
        font-size: 12px;
        padding: 8px 10px;
      }
      .section .body {
        padding: 10px;
      }
      .toggle-grp {
        font-size: 10px;
      }
    }

    /* ---------- EDITOR PANEL ---------- */
    .editor {
      overflow-y: auto;
      background: var(--paper);
      border-right: 1px solid var(--border);
      padding: 18px 20px 60px;
    }

    .editor h1 {
      font-size: 17px;
      color: var(--navy);
      margin: 0 0 2px;
    }

    .editor .sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .section {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .section>summary {
      background: var(--navy);
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }

    .section>summary::-webkit-details-marker {
      display: none;
    }

    .section>summary::before {
      content: "▸ ";
    }

    .section[open]>summary::before {
      content: "▾ ";
    }

    .section .body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--navy-dark);
      display: block;
      margin-bottom: 3px;
    }

    input[type=text],
    input[type=number],
    textarea,
    select {
      width: 100%;
      font-family: inherit;
      font-size: 12.5px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fbfcfc;
      color: var(--ink);
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      margin-bottom: 2px;
    }

    /* ---------- PREVIEW PANEL ---------- */
    .preview-wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .toolbar .grp {
      font-size: 11px;
      font-weight: bold;
      color: var(--navy-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar select {
      width: auto;
      padding: 4px 8px;
      font-size: 11.5px;
    }

    .toolbar .spacer {
      flex: 1;
    }

    .btn-print {
      background: var(--navy);
      color: #fff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0 2px 4px rgba(74, 91, 112, 0.2);
      transition: background .2s;
    }

    .btn-print:hover {
      background: var(--navy-dark);
    }

    .toggle-grp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: bold;
      color: var(--navy-dark);
      cursor: pointer;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 28px;
      height: 16px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #cbd5e0;
      transition: .2s;
      border-radius: 16px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    .toggle-switch input:checked+.toggle-slider {
      background-color: var(--teal);
    }

    .toggle-switch input:checked+.toggle-slider:before {
      transform: translateX(12px);
    }

    .canvas {
      flex: 1;
      overflow-y: auto;
      scrollbar-gutter: stable;
      text-align: center;
      padding: 40px 20px;
      background: #e4e8eb;
      background-image: radial-gradient(#c4cbd0 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #page-container {
      display: inline-block;
      position: relative;
      text-align: left;
      vertical-align: top;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 1px 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      background: var(--paper);
    }

    .sheet {
      background: var(--paper);
      padding: 15mm;
      font-size: 11px;
      line-height: 1.45;
      margin: 0;
    }

    .sheet.a4.portrait {
      width: 210mm;
      min-height: 297mm;
    }

    .sheet.a4.landscape {
      width: 297mm;
      min-height: 210mm;
    }

    .sheet.f4.portrait {
      width: 215mm;
      min-height: 330mm;
    }

    /* ---- Simple Clean Yellow Stabilo Highlight ---- */
    .stabilo-mark {
      background-color: #fff59d !important;
      color: #1a252f !important;
      font-weight: 700 !important;
      padding: 3px 6px !important;
      border-radius: 3px !important;
      display: inline-block !important;
    }

    tr.active-week-row {
      background-color: #fffde7 !important;
    }

    tr.active-week-row td {
      background-color: #fffde7 !important;
    }

    @media print {
      .stabilo-mark {
        background: transparent !important;
        padding: 0 !important;
        color: inherit !important;
      }
      tr.active-week-row,
      tr.active-week-row td {
        background: transparent !important;
      }
    }

    /* ---- Paper Patterns ---- */
    .sheet.pattern-y-so-serious {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/y-so-serious-white.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-double-bubble {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/double-bubble-outline.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-papyrus {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/papyrus.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-leaves {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/leaves.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-hotel-wallpaper {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/hotel-wallpaper.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-full-bloom {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/full-bloom.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-grid {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/gridme.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-lined {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/linedpaper.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-waves {
      background-image: url('https://www.toptal.com/designers/subtlepatterns/uploads/white-waves.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-ricepaper {
      background-image: url('https://raw.githubusercontent.com/atlemo/SubtlePatterns/master/ricepaper.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-linen {
      background-image: url('https://raw.githubusercontent.com/atlemo/SubtlePatterns/master/linen.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-graphy {
      background-image: url('https://raw.githubusercontent.com/atlemo/SubtlePatterns/master/graphy.png') !important;
      background-repeat: repeat !important;
    }

    .sheet.pattern-subtle_dots {
      background-image: url('https://raw.githubusercontent.com/atlemo/SubtlePatterns/master/subtle_dots.png') !important;
      background-repeat: repeat !important;
    }

    /* ---------- LAYOUT CETAK / PREVIEW ---------- */
    .m-header {
      display: flex;
      align-items: center;
      gap: 15px;
      border: 2px solid var(--navy-dark);
      background: var(--teal-bg-light);
      padding: 10px 15px;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .m-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 55px;
      height: 55px;
    }

    .m-logo svg,
    .m-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .m-title {
      flex: 1;
      font-size: 14px;
      font-weight: 800;
      color: var(--teal-text);
      background: var(--navy);
      padding: 6px 12px;
      border-radius: 4px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .m-badge {
      font-size: 8.5px;
      font-weight: 700;
      text-align: center;
      border: 1px solid var(--navy);
      padding: 4px 8px;
      border-radius: 4px;
      background: #fff;
      line-height: 1.3;
      min-width: 90px;
    }

    table.mtab {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
    }

    table.mtab th,
    table.mtab td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      font-size: 11px;
    }

    table.mtab td.key {
      font-weight: 700;
      width: 25%;
      background: var(--teal-bg-light);
      color: var(--navy-dark);
    }

    /* Styles for curriculum tables */
    table.adm-tab {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 12.5px;
    }

    table.adm-tab th {
      background: var(--navy);
      color: white;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-weight: 700;
      text-align: center;
    }

    table.adm-tab td {
      border: 1px solid var(--border);
      padding: 7px 8px;
      vertical-align: middle;
      color: var(--ink);
    }

    table.adm-tab tr:nth-child(even) td {
      background: #f8fafb;
    }

    table.prosem-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      margin-top: 10px;
    }

    table.prosem-table th,
    table.prosem-table td {
      border: 1px solid var(--border);
      padding: 4px 2px;
      text-align: center;
    }

    table.prosem-table th {
      background: var(--navy);
      color: white;
      font-weight: bold;
    }

    table.prosem-table td.materi-cell {
      text-align: left;
      padding-left: 6px;
      font-weight: 500;
    }

    table.prosem-table .cell-as {
      background: #e67e22 !important;
      color: white !important;
      font-weight: bold;
    }

    table.prosem-table .cell-jp {
      font-weight: bold;
    }

    table.prosem-table tr.total-row td {
      background: #eaf3e5;
      font-weight: bold;
      color: #3b4a5c;
    }

    .sign-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 30px;
      font-size: 11px;
      line-height: 1.4;
      page-break-inside: avoid;
    }

    .sign-grid div {
      text-align: center;
    }

    .sign-grid .gap {
      height: 55px;
    }

    .sign-grid .name {
      font-weight: 700;
      text-decoration: underline;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      body {
        background: #fff;
      }

      .canvas {
        padding: 0;
        overflow: visible;
        display: block;
        background: transparent !important;
        background-image: none !important;
      }

      .preview-wrap {
        height: auto !important;
        display: block !important;
      }

      #page-container {
        display: block !important;
        width: auto !important;
        height: auto !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: none !important;
      }

      .app {
        display: block;
        height: auto;
      }

      .sheet {
        box-shadow: none;
        margin: 0 !important;
        padding: 0 !important;
        width: auto !important;
        min-height: 0 !important;
        transform: none !important;
        background: transparent !important;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =============== EDITOR =============== -->
    <div class="editor no-print">
      <div id="accountBadge" style="display: none; align-items: center; justify-content: space-between; margin-bottom: 15px; padding: 10px 12px; background: #eaf3e5; border: 1px solid #cfe6c2; border-radius: 6px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div id="accountBadgeAvatar" style="width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(#DB4437 0deg 90deg, #F4B400 90deg 180deg, #0F9D58 180deg 270deg, #4285F4 270deg 360deg); padding: 2.5px; flex-shrink: 0;">
            <div style="width: 100%; height: 100%; border-radius: 50%; background: var(--teal); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; overflow: hidden;" id="accountBadgeAvatarInner">U</div>
          </div>
          <div>
            <div style="font-size: 10px; color: var(--muted); font-weight: 600; line-height: 1;">Akun Google Aktif:</div>
            <div id="accountBadgeName" style="font-size: 13px; font-weight: bold; color: var(--navy-dark); line-height: 1.4;"></div>
            <div id="accountBadgeEmail" style="font-size: 11px; color: var(--navy); line-height: 1;"></div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
          <div id="cloudSyncStatus" style="display: none; align-items: center; gap: 4px; font-size: 11px; color: var(--navy); opacity: 0.8;" title="Tersimpan di Cloud">
            <svg id="cloudSyncIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Default: Saved -->
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
              <polyline points="9 14 11 16 15 11"></polyline>
            </svg>
            <span id="cloudSyncText" style="display:none; font-weight:600;">Tersimpan</span>
          </div>
          <button onclick="logoutGoogle()" style="background: #fff; border: 1px solid #e0e0e0; color: #c53030; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;">Logout</button>
        </div>
      </div>
      <h1>Generator Modul Ajar</h1>
      <div class="sub">Manajemen perangkat administrasi pembelajaran. Haris DevLab.</div>

      <!-- Navigation Tabs -->
      <div style="display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 2px solid var(--bg); padding-bottom: 8px;" class="no-print">
        <a href="index.html" style="text-decoration: none; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; background: #eef1f2; color: var(--navy-dark); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);">
          <span>📝</span> Modul Ajar
        </a>
        <a href="administrasi.html" id="navAdministrasi" style="text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; background: var(--navy); color: white; display: inline-flex; align-items: center; gap: 6px;">
          <span>📂</span> Administrasi Kelas
        </a>
        <a href="jurnal.html" id="navJurnal" style="text-decoration: none; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; background: #eef1f2; color: var(--navy-dark); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);">
          <span>📖</span> Jurnal Mengajar
        </a>
      </div>

      <details class="section" open>
        <summary>Pilihan Administrasi</summary>
        <div class="body">
          <div class="field">
            <label>Jenis Perangkat Administrasi</label>
            <select id="docType" onchange="renderPreview()">
              <option value="prosem">Program Semester (PROSEM)</option>
              <option value="prota">Program Tahunan (PROTA)</option>
              <option value="tp">Tujuan Pembelajaran (TP)</option>
              <option value="jadwal">Jadwal Jam Mengajar</option>
              <option value="jurnal">Jurnal Mengajar Harian</option>
            </select>
          </div>
          <div class="field" id="fieldKelas">
            <label>Tingkat Kelas</label>
            <select id="docKelas" onchange="renderPreview()">
              <option value="IV">Kelas IV (Empat)</option>
              <option value="V">Kelas V (Lima)</option>
              <option value="VI" selected>Kelas VI (Enam)</option>
            </select>
          </div>
          <div class="field" id="fieldRombel" style="display: none;">
            <label>Pilih Rombel / Kelas Mengajar</label>
            <select id="docRombel" onchange="renderPreview()">
              <optgroup label="Kelas IV">
                <option value="4 Sana'a">4 Sana'a — Rabu (13.30 - 14.20)</option>
                <option value="4 Yaman">4 Yaman — Senin (09.40 - 10.50)</option>
                <option value="4 Muskat">4 Muskat — Kamis (07.30 - 08.40)</option>
                <option value="4 Abu Dhabi">4 Abu Dhabi — Rabu (09.40 - 10.50)</option>
                <option value="4 Najaf">4 Najaf — Jumat (07.30 - 08.40)</option>
              </optgroup>
              <optgroup label="Kelas V">
                <option value="5 Cordoba">5 Cordoba — Senin (12.20 - 13.30)</option>
                <option value="5 Damaskus">5 Damaskus — Jumat (12.20 - 13.30)</option>
                <option value="5 Istanbul">5 Istanbul — Rabu (12.20 - 13.30)</option>
                <option value="5 Amman">5 Amman — Kamis (12.20 - 13.30)</option>
              </optgroup>
              <optgroup label="Kelas VI">
                <option value="6 Kuffah" selected>6 Kuffah — Kamis (13.30 - 14.20)</option>
                <option value="6 Granada">6 Granada — Rabu (08.05 - 09.15)</option>
                <option value="6 Madrid">6 Madrid — Kamis (10.15 - 11.25)</option>
                <option value="6 Almeria">6 Almeria — Jumat (10.15 - 11.25)</option>
              </optgroup>
            </select>
          </div>

          <div class="field" id="fieldStabiloJurnal" style="background: #fefce8; padding: 10px; border-radius: 8px; border: 1px solid #fef08a; margin-top: 12px; display: none;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 800; color: #854d0e; cursor: pointer; text-transform: none;">
              <input type="checkbox" id="chkHighlightActive" checked onchange="renderPreview()" style="width: 16px; height: 16px; accent-color: #ca8a04; cursor: pointer;">
              🖍️ Sorot Baris KBM Disertai Spidol Stabilo (Yellow Pen)
            </label>
            <div style="margin-top: 8px;">
              <label style="font-size: 10.5px; font-weight: 700; color: #a16207;">Target Pertemuan yang Disorot Stabilo:</label>
              <select id="highlightMeetingTarget" onchange="renderPreview()" style="width: 100%; margin-top: 4px; font-size: 11.5px; font-weight: 600; padding: 5px 8px; border-radius: 6px; border: 1px solid #fde047; background: #ffffff; color: #713f12;">
                <option value="auto" selected>⚡ Otomatis (Sesuai Kaldik Realtime Tanggal Hari Ini)</option>

    function getFormattedJurnalTp(tp, kelasVal) {
      if (!tp) return "";
      if (kelasVal === 'VI' || (typeof kelasVal === 'string' && (kelasVal.startsWith('6') || kelasVal.includes('6')))) {
        return tp.replace(/\b5\./g, '6.');
      }
      return tp;
    }

    function copyJurnalRowText(index) {
      const kelasVal = v('docKelas');
      const rombelVal = v('docRombel') || (kelasVal === 'IV' ? "4 Sana'a" : (kelasVal === 'V' ? '5 Cordoba' : '6 Kuffah'));
      const data = kelasVal === 'IV' ? JURNAL_DATA_IV : JURNAL_DATA_V_VI;
      const item = data[index];
      if (!item) return;

      const guruNama = v('guruNama') || 'Haris Ratno Pambudi, S.T.';
      const mapel = v('mapel') || 'Koding dan Kecerdasan Artifisial (KKA)';
      const wkt = WEEK_MAPPING[item.p] || "";
      const tpFormatted = getFormattedJurnalTp(item.tp, kelasVal);

      const text = `Hari/Tanggal: [Diisi Tanggal KBM] (${wkt})
Nama Guru: ${guruNama}
Kelas: ${rombelVal}
Mata Pelajaran: ${mapel}
Pertemuan ke: ${item.p}
Estimasi Waktu: ${wkt}
Materi Pembelajaran: ${item.materi}
Tujuan Pembelajaran: ${tpFormatted}
Model dan Metode Pembelajaran: ${item.model}
Media Pembelajaran: ${item.media}
Ketuntasan/ketercapaian murid dalam memahami materi pembelajaran: ${item.tuntas}
Kendala yang dihadapi saat KBM: ${item.kendala}`;

      navigator.clipboard.writeText(text).then(() => {
        alert(`📋 Isian Form Pertemuan Ke-${item.p} [${wkt}] (${rombelVal}) Berhasil Disalin!`);
      }).catch(err => {
        console.error('Gagal salin:', err);

    function renderJurnalTable() {
      const kelasVal = v('docKelas');

      const targetMeetingVal = document.getElementById('highlightMeetingTarget') ? document.getElementById('highlightMeetingTarget').value : 'auto';
      let activeMeetingNum = 2;
      if (targetMeetingVal === 'auto') {
        const todayStr = new Date().toISOString().split('T')[0];
        activeMeetingNum = (typeof window.getMeetingNumberFromDate === 'function') ? window.getMeetingNumberFromDate(todayStr) : 2;
      } else {
        activeMeetingNum = parseInt(targetMeetingVal) || 2;
      }
      const isHighlightEnabled = document.getElementById('chkHighlightActive') ? document.getElementById('chkHighlightActive').checked : true;

      let rowsHTML = "";
      data.forEach((item, index) => {
        const wkt = WEEK_MAPPING[item.p] || "";
        let kendalaText = item.kendala;
        if (window.ROMBEL_KENDALA_VARIATIONS && window.ROMBEL_KENDALA_VARIATIONS[rombelVal]) {
          const list = window.ROMBEL_KENDALA_VARIATIONS[rombelVal];
          kendalaText = list[(item.p - 1) % list.length];
        }

        const isCurrentRow = (item.p === activeMeetingNum);
        let rowStyleAttr = "";
        let wktHTML = esc(wkt);

        if (isHighlightEnabled && isCurrentRow) {
          rowStyleAttr = 'class="active-week-row"';
          wktHTML = `<span class="stabilo-mark">${esc(wkt)}</span>`;
        }

        const tpFormatted = getFormattedJurnalTp(item.tp, kelasVal);

        rowsHTML += `
          <tr ${rowStyleAttr}>
            <td style="text-align: center; font-weight: bold; width: 4%;">${item.p}</td>
            <td style="text-align: center; width: 11%; font-weight: 700;">${wktHTML}</td>
            <td style="text-align: center; width: 5%; font-weight: 600;">Smt ${item.smt}</td>
            <td style="font-weight: 600; width: 16%;">${esc(item.materi)}</td>

            <td style="width: 14%;">${esc(item.model)}</td>
            <td style="width: 12%;">${esc(item.media)}</td>
            <td style="text-align: center; font-weight: bold; width: 5%; color: #2e7d32;">${item.tuntas}</td>
            <td style="width: 10%; font-size: 10px;">${esc(kendalaText)}</td>
            <td class="no-print" style="text-align: center; width: 4%;">
              <button onclick="copyJurnalRowText(${index})" style="background: #eaf3e5; border: 1px solid #cfe6c2; color: #3b4a5c; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer;">📋 Salin</button>
            </td>
          </tr>
        `;
      });

      return `

          Rincian Isian Google Form KBM — Rombel: <span style="color: var(--teal-dark);">${esc(rombelVal)}</span> (1 Tahun Ajaran / 31 Pertemuan)
        </div>
        <table class="adm-tab" style="font-size: 10.5px;">
          <thead>
            <tr>
              <th style="width: 4%;">P.Ke</th>
              <th style="width: 10%;">Waktu (Bulan &amp; Minggu)</th>

              <th style="width: 12%;">Media Pembelajaran</th>

              <th style="width: 10%;">Kendala saat KBM</th>

          Tips: Klik tombol "📋 Salin" pada pertemuan yang bersangkutan, lalu langsung tempelkan (paste) ke Form Google sekolah.
        </div>
      `;
    }

    function v(id) {

    function esc(text) {
      if (!text) return "";
      return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function applyZoom() {
      const z = document.getElementById('zoom').value;
      const page = document.getElementById('page');
      const container = document.getElementById('page-container');
      const canvas = document.querySelector('.canvas');
      if (!page || !container || !canvas) return;

      const size = document.getElementById('paperSize').value;
      const orient = document.getElementById('orientation').value;
      const [w, h] = sizes[size][orient];

      const pagePxWidth = w * 3.7795;
      const pagePxHeight = h * 3.7795;

      let scale = 1;
      if (z === "fit") {
        const canvasWidth = canvas.clientWidth - 40;
        scale = canvasWidth / pagePxWidth;
        scale = Math.min(Math.max(scale, 0.4), 1.2);
      } else {
        scale = parseFloat(z);
      }

      page.style.transform = `scale(${scale})`;
      page.style.transformOrigin = "top left";

      container.style.width = `${pagePxWidth * scale}px`;
      container.style.height = `${page.offsetHeight * scale}px`;
    }

    function applyPresetTheme(themeKey) {
      const sliderGrp = document.getElementById('sliderGroup');
      if (themeKey === 'custom') {
        if (sliderGrp) sliderGrp.style.display = 'flex';
        const sliderEl = document.getElementById('themeHue');
        const currentHue = sliderEl ? sliderEl.value : 102;
        applyHueTheme(currentHue);
        return;
      }
      if (sliderGrp) sliderGrp.style.display = 'none';

      const t = themes[themeKey] || themes.original;
      const page = document.getElementById('page');
      if (page) {
        page.style.setProperty('--teal', t.primary);
        page.style.setProperty('--teal-dark', t.dark);
        page.style.setProperty('--teal-light', t.light);
        page.style.setProperty('--teal-border-light', t.borderLight);
        page.style.setProperty('--teal-bg-light', t.bgLight);
        page.style.setProperty('--teal-text', t.text || '#ffffff');
        page.style.setProperty('--navy', t.navy || '#4a5b70');
        page.style.setProperty('--navy-dark', t.navyDark || '#3b4a5c');
      }

      const themeSelect = document.getElementById('paperTheme');
      if (themeSelect) themeSelect.value = themeKey;

      const sliderEl = document.getElementById('themeHue');
      if (sliderEl && t.hue !== undefined) {
        sliderEl.value = t.hue;
        const valEl = document.getElementById('hueVal');
        if (valEl) valEl.textContent = t.hue + '°';
      }

      try {
        localStorage.setItem('hdl_paper_theme_mode', themeKey);
      } catch (e) {}
    }

    function applyHueTheme(hue) {
      const h = parseInt(hue);
      const sliderGrp = document.getElementById('sliderGroup');
      if (sliderGrp) sliderGrp.style.display = 'flex';

      const primary = `hsl(${h}, 45%, 70%)`;
      const dark = `hsl(${h}, 45%, 45%)`;
      const light = `hsl(${h}, 45%, 96%)`;
      const borderLight = `hsl(${h}, 45%, 88%)`;
      const bgLight = `hsl(${h}, 45%, 98%)`;
      const text = `hsl(${h}, 50%, 20%)`;
      const navy = `hsl(${h}, 30%, 30%)`;
      const navyDark = `hsl(${h}, 30%, 22%)`;

      const page = document.getElementById('page');
      if (page) {
        page.style.setProperty('--teal', primary);
        page.style.setProperty('--teal-dark', dark);
        page.style.setProperty('--teal-light', light);
        page.style.setProperty('--teal-border-light', borderLight);
        page.style.setProperty('--teal-bg-light', bgLight);
        page.style.setProperty('--teal-text', text);
        page.style.setProperty('--navy', navy);
        page.style.setProperty('--navy-dark', navyDark);
      }

      const valEl = document.getElementById('hueVal');
      if (valEl) valEl.textContent = h + '°';

      const sliderEl = document.getElementById('themeHue');
      if (sliderEl) sliderEl.value = h;

      const themeSelect = document.getElementById('paperTheme');
      if (themeSelect) themeSelect.value = 'custom';

      try {
        localStorage.setItem('hdl_paper_theme_mode', 'custom');
        localStorage.setItem('hdl_paper_theme_hue', h);
      } catch (e) {}
    }

    const PERSIST_PROFILE_FIELDS = [
      'penyusun', 'instansi', 'tahun', 'jenjang', 'mapel', 'fase',
      'tempatTgl', 'kepsekNama', 'kepsekLabelType', 'kepsekNIY', 'guruNama', 'guruLabelType', 'guruNIY'
    ];
    const PERSIST_PROFILE_CHECKBOXES = [
      'toggleBanner', 'toggleLogoYayasan'
    ];

    let cloudSyncTimeout = null;

    function updateCloudSyncStatus(state) {
      const icon = document.getElementById('cloudSyncIcon');
      const text = document.getElementById('cloudSyncText');
      const statusDiv = document.getElementById('cloudSyncStatus');
      if (!icon || !text || !statusDiv) return;
      
      const isLogged = localStorage.getItem('hdl_access_code') && localStorage.getItem('hdl_access_code').startsWith('google_jwt_token:');
      if (!isLogged) {
        statusDiv.style.display = 'none';
        return;
      }
      statusDiv.style.display = 'flex';

      if (state === 'syncing') {
        icon.innerHTML = '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><polyline points="12 11 12 16"></polyline><polyline points="9 13 12 11 15 13"></polyline>';
        icon.style.color = 'var(--navy)';
        text.textContent = 'Menyimpan...';
        text.style.display = 'inline';
        statusDiv.title = 'Menyimpan ke Cloud...';
      } else if (state === 'saved') {
        icon.innerHTML = '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><polyline points="9 14 11 16 15 11"></polyline>';
        icon.style.color = '#38a169'; // green
        text.textContent = 'Tersimpan';
        text.style.display = 'none';
        statusDiv.title = 'Tersimpan di Cloud';
      } else if (state === 'error') {
        icon.innerHTML = '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><line x1="12" y1="12" x2="12" y2="16"></line><line x1="12" y1="18" x2="12.01" y2="18"></line>';
        icon.style.color = '#e53e3e'; // red
        text.textContent = 'Gagal Simpan';
        text.style.display = 'inline';
        statusDiv.title = 'Gagal menyimpan ke Cloud';
      }
    }

    function getProfileStorageKey(id) {
       const userEmail = (localStorage.getItem('hdl_user_email') || '').trim().toLowerCase();
       return userEmail ? `hdl_persisted_${userEmail}_${id}` : `hdl_persisted_${id}`;
    }

    function saveProfileFields() {
      try {
        let profileData = { fields: {}, checkboxes: {} };
        PERSIST_PROFILE_FIELDS.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            localStorage.setItem(getProfileStorageKey(id), el.value);
            profileData.fields[id] = el.value;
          }
        });
        PERSIST_PROFILE_CHECKBOXES.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            const val = el.checked ? 'true' : 'false';
            localStorage.setItem(getProfileStorageKey(id), val);
            profileData.checkboxes[id] = val;
          }
        });

        // Sync to cloud if logged in, debounced (wait 2 seconds after last typing)
        const token = localStorage.getItem('hdl_access_code');
        if (token && token.startsWith('google_jwt_token:')) {
           updateCloudSyncStatus('syncing');
           clearTimeout(cloudSyncTimeout);
           cloudSyncTimeout = setTimeout(() => {
              // Re-read latest profile fields for cloud sync to avoid closure capturing old/default values
              let latestProfileData = { fields: {}, checkboxes: {} };
              PERSIST_PROFILE_FIELDS.forEach(id => {
                const el = document.getElementById(id);
                if (el) latestProfileData.fields[id] = el.value;
              });
              PERSIST_PROFILE_CHECKBOXES.forEach(id => {
                const el = document.getElementById(id);
                if (el) latestProfileData.checkboxes[id] = el.checked ? 'true' : 'false';
              });

              fetch('https://bold-block-f2cd.harisratnopambudi.workers.dev/profile', {
                 method: 'POST',
                 headers: { 'Authorization': 'Bearer ' + token },
                 body: JSON.stringify(latestProfileData)
              }).then(res => {
                 if (res.ok) updateCloudSyncStatus('saved');
                 else {
                     res.text().then(txt => {
                         console.error("Cloud sync err:", res.status, txt);
                         const statusDiv = document.getElementById('cloudSyncStatus');
                         if(statusDiv) statusDiv.title = `Gagal (Kode: ${res.status}). Tunggu atau relogin.`;
                     }).catch(e=>{});
                     updateCloudSyncStatus('error');
                 }
              }).catch(e => {
                 console.error("Cloud sync failed", e);
                 updateCloudSyncStatus('error');
              });
           }, 2000);
        }
      } catch (e) { }
    }

    async function loadProfileFields() {
      try {
        // Try cloud first if logged in
        const token = localStorage.getItem('hdl_access_code');
        if (token && token.startsWith('google_jwt_token:')) {
           try {
              const res = await fetch('https://bold-block-f2cd.harisratnopambudi.workers.dev/profile', {
                 headers: { 'Authorization': 'Bearer ' + token }
              });
              if (res.ok) {
                 const cloudData = await res.json();
                 if (cloudData && cloudData.fields) {
                    // Save to local storage and update UI
                    for (const id in cloudData.fields) {
                       localStorage.setItem(getProfileStorageKey(id), cloudData.fields[id]);
                    }
                    for (const id in cloudData.checkboxes) {
                       localStorage.setItem(getProfileStorageKey(id), cloudData.checkboxes[id]);
                    }
                 }
              }
           } catch(e) {
              console.error("Failed to load profile from cloud", e);
           }
        }

        // Load from local storage
        PERSIST_PROFILE_FIELDS.forEach(id => {
          const val = localStorage.getItem(getProfileStorageKey(id));
          const el = document.getElementById(id);
          if (val !== null && el) {
            el.value = val;
          }
          // Attach auto-save listener
          if (el && !el.dataset.autosaveAttached) {
             el.addEventListener('input', saveProfileFields);
             el.dataset.autosaveAttached = 'true';
          }
        });
        PERSIST_PROFILE_CHECKBOXES.forEach(id => {
          const val = localStorage.getItem(getProfileStorageKey(id));
          const el = document.getElementById(id);
          if (val !== null && el) {
            el.checked = (val === 'true');
          }
          // Attach auto-save listener
          if (el && !el.dataset.autosaveAttached) {
             el.addEventListener('change', saveProfileFields);
             el.dataset.autosaveAttached = 'true';
          }
        });
        
        if (typeof renderPreview === 'function') {
           renderPreview();
        }
      } catch (e) { }
    }

    function checkLoginBadge() {
      try {
        const savedCode = localStorage.getItem('hdl_access_code') || '';
        const badge = document.getElementById('accountBadge');
        if (!savedCode) {
          if (badge) badge.style.display = 'none';
        } else {
          if (badge) {
            badge.style.display = 'flex';
            const uName = localStorage.getItem('hdl_user_name') || 'Pengguna';
            const uEmail = localStorage.getItem('hdl_user_email') || '';
            const uPhoto = localStorage.getItem('hdl_user_photo') || '';
            const nameEl = document.getElementById('accountBadgeName');
            const emailEl = document.getElementById('accountBadgeEmail');
            const avatarInner = document.getElementById('accountBadgeAvatarInner');
            if (nameEl) nameEl.textContent = uName;
            if (emailEl) emailEl.textContent = uEmail;
            if (uPhoto && avatarInner) {
              avatarInner.innerHTML = '<img src="' + uPhoto + '" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.parentElement.textContent=\'' + uName.charAt(0).toUpperCase() + '\'">'; 
            } else if (avatarInner) {
              avatarInner.textContent = uName.charAt(0).toUpperCase();
            }
            updateCloudSyncStatus('saved');
          }
        }
      } catch (e) { }
    }

    function logoutGoogle() {
      localStorage.removeItem('hdl_access_code');
      localStorage.removeItem('hdl_access_code_time');
      localStorage.removeItem('hdl_user_email');
      localStorage.removeItem('hdl_user_name');
      localStorage.removeItem('hdl_user_photo');
      window.location.href = 'index.html';
    }

    // Window load initialization
    window.addEventListener('load', () => {
      // Load saved identity fields
      loadProfileFields();
      checkLoginBadge();

      try {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('type') === 'jurnal') {
          const docTypeEl = document.getElementById('docType');
          if (docTypeEl) docTypeEl.value = 'jurnal';
        }
      } catch (e) { }

      // Retrieve themes or styles from localStorage if any, to align with index page
      try {
        const savedPattern = localStorage.getItem('hdl_paper_pattern');
        if (savedPattern) {
          const patSelect = document.getElementById('paperPattern');
          if (patSelect) patSelect.value = savedPattern;
        }
        const savedTheme = localStorage.getItem('hdl_paper_theme_mode') || 'original';
        applyPresetTheme(savedTheme);
      } catch (e) {
        applyPresetTheme('original');
      }

      onDocTypeChange();
      renderPreview();
      updatePageStyle();
      applyZoom();
      window.addEventListener('resize', applyZoom);
    });
  </script>

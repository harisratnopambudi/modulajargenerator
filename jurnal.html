<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Mengajar Harian - Haris DevLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #4a5b70;
      --navy-dark: #3b4a5c;
      --teal: #6aa84f;
      --teal-dark: #588a41;
      --teal-light: #eaf3e5;
      --teal-border-light: #cfe6c2;
      --teal-bg-light: #f6faf4;
      --teal-text: #ffffff;
      --border: #c9d3d6;
      --ink: #1f2a30;
      --muted: #5c6b70;
      --paper: #ffffff;
      --bg: #eef1f2;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color-adjust: exact;
    }

    body {
      margin: 0;
      font-family: 'Trebuchet MS', 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
    }

    /* ---------- MOBILE RESPONSIVE ---------- */
    @media screen and (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }
      .editor {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: none;
        overflow-y: visible;
        padding: 14px 14px 40px;
      }
      .preview-wrap {
        height: auto;
        min-height: auto;
      }
      .canvas {
        padding: 16px 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      #page-container {
        transform-origin: top left;
        max-width: 100%;
      }
      .toolbar {
        padding: 8px 10px;
        flex-wrap: wrap;
        gap: 6px;
        position: relative;
      }
      .btn-print {
        position: fixed;
        top: auto !important;
        bottom: 16px;
        right: 16px;
        left: 16px;
        width: auto;
        font-size: 13px;
        padding: 12px 16px;
        border-radius: 24px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        z-index: 9999;
        white-space: nowrap;
        text-align: center;
      }
    }

    /* ---------- EDITOR PANEL ---------- */
    .editor {
      overflow-y: auto;
      background: var(--paper);
      border-right: 1px solid var(--border);
      padding: 18px 20px 60px;
    }

    .editor h1 {
      font-size: 17px;
      color: var(--navy);
      margin: 0 0 2px;
    }

    .editor .sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .section {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .section>summary {
      background: var(--navy);
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }

    .section>summary::-webkit-details-marker {
      display: none;
    }

    .section>summary::before {
      content: "▸ ";
    }

    .section[open]>summary::before {
      content: "▾ ";
    }

    .section .body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--navy-dark);
      display: block;
      margin-bottom: 3px;
    }

    input[type=text],
    input[type=number],
    textarea,
    select {
      width: 100%;
      font-family: inherit;
      font-size: 12.5px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ---------- PREVIEW AREA ---------- */
    .preview-wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #cfd8dc;
      overflow: hidden;
    }

    .toolbar {
      background: #263238;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .toolbar select {
      background: #37474f;
      color: #fff;
      border: 1px solid #546e7a;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .toolbar .grp {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spacer {
      flex: 1;
    }

    .btn-print {
      background: var(--teal);
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12.5px;
      transition: background 0.2s;
    }

    .btn-print:hover {
      background: var(--teal-dark);
    }

    .btn-copy-all {
      background: #0288d1;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-copy-all:hover {
      background: #0277bd;
    }

    .canvas {
      flex: 1;
      overflow: auto;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    #page-container {
      margin: 0 auto;
    }

    .sheet {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      position: relative;
      box-sizing: border-box;
      padding: 15mm;
    }

    .sheet.f4.landscape { width: 330mm; min-height: 215mm; }
    .sheet.f4.portrait { width: 215mm; min-height: 330mm; }
    .sheet.a4.landscape { width: 297mm; min-height: 210mm; }
    .sheet.a4.portrait { width: 210mm; min-height: 297mm; }

    /* Paper Patterns */
    .pattern-linen { background-image: radial-gradient(#d5e1d2 0.75px, transparent 0.75px); background-size: 12px 12px; }

    /* Table Styles */
    table.jurnal-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 11px;
    }

    table.jurnal-table th {
      background: var(--navy);
      color: white;
      border: 1px solid var(--border);
      padding: 8px 6px;
      font-weight: 700;
      text-align: center;
    }

    table.jurnal-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      vertical-align: top;
      color: var(--ink);
    }

    table.jurnal-table tr:nth-child(even) td {
      background: #f8fafb;
    }

    .btn-copy-row {
      background: #eaf3e5;
      border: 1px solid #cfe6c2;
      color: #3b4a5c;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-copy-row:hover {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal-dark);
    }

    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1b5e20;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 99999;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sign-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 30px;
      font-size: 11px;
      line-height: 1.4;
      page-break-inside: avoid;
    }

    .sign-grid div { text-align: center; }
    .sign-grid .gap { height: 55px; }
    .sign-grid .name { font-weight: 700; text-decoration: underline; }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .canvas { padding: 0 !important; overflow: visible !important; display: block !important; }
      .preview-wrap { height: auto !important; display: block !important; }
      #page-container { display: block !important; width: auto !important; height: auto !important; margin: 0 !important; padding: 0 !important; }
      .sheet { box-shadow: none !important; margin: 0 !important; padding: 0 !important; width: auto !important; min-height: 0 !important; transform: none !important; background: transparent !important; }
    }
  </style>
</head>

    function v(id) {
      const el = document.getElementById(id);
      return el ? el.value : "";

    function esc(text) {
      if (!text) return "";
      return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function getSelectedJurnalData() {
      const rombel = v('jurnalRombel');
      return rombel.startsWith('4') ? JURNAL_DATA_IV : JURNAL_DATA_V_VI;

    function showToast(msg) {
      const el = document.getElementById('toastMsg');
      if (!el) return;
      el.textContent = msg || '📋 Isian Form Google Berhasil Disalin!';
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function copyRowText(index) {
      const data = getSelectedJurnalData();
      const item = data[index];
      if (!item) return;

      const rombel = v('jurnalRombel');
      const guruNama = v('guruNama') || 'Haris Ratno Pambudi, S.T.';
      const mapel = v('mapel') || 'Koding dan Kecerdasan Artifisial (KKA)';

      const text = `Hari/Tanggal: [Diisi Tanggal KBM]

Model dan Metode Pembelajaran: ${item.model}

Kendala yang dihadapi saat KBM: ${item.kendala}`;

      navigator.clipboard.writeText(text).then(() => {

      const guruNama = v('guruNama') || 'Haris Ratno Pambudi, S.T.';
      const mapel = v('mapel') || 'Koding dan Kecerdasan Artifisial (KKA)';

      let fullText = `=== BANK ISIAN JURNAL MENGAJAR FORM GOOGLE ===\nKelas: ${rombel} | Guru: ${guruNama} | Mapel: ${mapel}\n\n`;

      data.forEach(item => {
        if (smtFilter === '1' && item.smt !== 1) return;
        if (smtFilter === '2' && item.smt !== 2) return;

        fullText += `[PERTEMUAN KE-${item.p} (Semester ${item.smt})]\n`;
        fullText += `Pertemuan ke: ${item.p}\n`;
        fullText += `Materi Pembelajaran: ${item.materi}\n`;
        fullText += `Tujuan Pembelajaran: ${item.tp}\n`;
        fullText += `Model dan Metode Pembelajaran: ${item.model}\n`;
        fullText += `Media Pembelajaran: ${item.media}\n`;
        fullText += `Ketuntasan/ketercapaian murid: ${item.tuntas}\n`;
        fullText += `Kendala yang dihadapi saat KBM: ${item.kendala}\n`;
        fullText += `--------------------------------------------------\n\n`;
      });

      navigator.clipboard.writeText(fullText).then(() => {
        showToast(`📋 Seluruh Isian Jurnal (${rombel}) Berhasil Disalin!`);
      }).catch(err => {
        console.error('Gagal salin:', err);
      });
    }

    function renderPreview() {
      const rombel = v('jurnalRombel');
      const smtFilter = v('jurnalSmt');
      const instansi = v('instansi');
      const mapel = v('mapel');
      const tahun = v('tahun');
      const tempatTgl = v('tempatTgl');
      const kepsekNama = v('kepsekNama');
      const kepsekNIY = v('kepsekNIY');
      const guruNama = v('guruNama');
      const guruNIY = v('guruNIY');

      const data = getSelectedJurnalData();
      let rowsHTML = "";
      let count = 0;

      data.forEach((item, index) => {
        if (smtFilter === '1' && item.smt !== 1) return;
        if (smtFilter === '2' && item.smt !== 2) return;
        count++;

        rowsHTML += `
          <tr>
            <td style="text-align: center; font-weight: bold; width: 4%;">${item.p}</td>
            <td style="text-align: center; width: 6%; font-weight: 600;">Smt ${item.smt}</td>
            <td style="font-weight: 600; width: 17%;">${esc(item.materi)}</td>
            <td style="width: 22%;">${esc(item.tp)}</td>
            <td style="width: 15%;">${esc(item.model)}</td>
            <td style="width: 13%;">${esc(item.media)}</td>
            <td style="text-align: center; font-weight: bold; width: 5%; color: #2e7d32;">${item.tuntas}</td>
            <td style="width: 12%; font-size: 10px;">${esc(item.kendala)}</td>
            <td class="no-print" style="text-align: center; width: 6%;">
              <button class="btn-copy-row" onclick="copyRowText(${index})" title="Salin format untuk Google Form">📋 Salin</button>
            </td>
          </tr>
        `;
      });

      const html = `
        <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px; margin-bottom: 20px; border-bottom: 2px solid #3b4a5c; padding-bottom: 10px;">
          <img src="${YAYASAN_LOGO_SRC}" alt="Logo Yayasan" style="width: 60px; height: 60px; object-fit: contain;" onerror="this.style.display='none';">
          <div style="flex: 1; text-align: center;">
            <div style="font-size: 17px; font-weight: 800; color: #3b4a5c; text-transform: uppercase; letter-spacing: 1px;">JURNAL MENGAJAR HARIAN GURU</div>
            <div style="font-size: 15px; font-weight: 800; color: #3b4a5c; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px;">${esc(instansi).toUpperCase()}</div>
            <div style="font-size: 11px; font-weight: 700; color: #7a8a90; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px;">KELAS ${esc(rombel).toUpperCase()} &mdash; MATA PELAJARAN ${esc(mapel).toUpperCase()}</div>
            <div style="font-size: 11px; font-weight: 700; color: #7a8a90; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px;">TAHUN AJARAN ${esc(tahun)}</div>
          </div>
          <img src="${DEFAULT_LOGO_SRC}" alt="Logo Sekolah" style="width: 60px; height: 60px; object-fit: contain;" onerror="this.style.display='none';">
        </div>

        <table class="jurnal-table">
          <thead>
            <tr>
              <th style="width: 4%;">P.Ke</th>
              <th style="width: 6%;">Smt</th>
              <th style="width: 17%;">Materi Pembelajaran</th>
              <th style="width: 22%;">Tujuan Pembelajaran (TP)</th>
              <th style="width: 15%;">Model &amp; Metode</th>
              <th style="width: 13%;">Media Pembelajaran</th>
              <th style="width: 5%;">Tuntas</th>
              <th style="width: 12%;">Kendala saat KBM</th>
              <th class="no-print" style="width: 6%;">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHTML}
          </tbody>
        </table>

        <div style="font-size: 10px; font-style: italic; margin-top: 10px; color: var(--muted);">
          Catatan: Jurnal Mengajar Harian diisi setiap selesai KBM pada Form Google sekolah. Klik tombol "📋 Salin" pada setiap baris untuk menyalin isian secara instan.
        </div>

        <div class="sign-grid">
          <div>
            Mengetahui<br>Kepala Sekolah ${esc(instansi)}
            <div class="gap"></div>
            <div class="name">${esc(kepsekNama)}</div>
            NIY. ${esc(kepsekNIY)}
          </div>
          <div>
            ${esc(tempatTgl)}<br>Guru Bidang Studi
            <div class="gap"></div>
            <div class="name">${esc(guruNama)}</div>
            NIY. ${esc(guruNIY)}
          </div>
        </div>
      `;

      const page = document.getElementById('page');
      if (page) page.innerHTML = html;
    }

    const sizes = {
      a4: { portrait: [210, 297], landscape: [297, 210] },
      f4: { portrait: [215, 330], landscape: [330, 215] }
    };

    function updatePageStyle() {
      const size = document.getElementById('paperSize').value;
      const orient = document.getElementById('orientation').value;
      const page = document.getElementById('page');
      if (!page) return;

      page.className = "sheet " + size + " " + orient + " pattern-linen";
      const [w, h] = sizes[size][orient];
      page.style.padding = orient === 'landscape' ? '8mm 10mm' : '15mm';

      document.getElementById('pageSizeStyle').innerHTML = `
        @page { size: ${w}mm ${h}mm; margin: ${orient === 'landscape' ? '8mm 10mm' : '15mm'}; }
      `;
      applyZoom();
      renderPreview();
    }

    function applyZoom() {
      const z = document.getElementById('zoom').value;
      const page = document.getElementById('page');
      const container = document.getElementById('page-container');
      const canvas = document.querySelector('.canvas');
      if (!page || !container || !canvas) return;

      const size = document.getElementById('paperSize').value;
      const orient = document.getElementById('orientation').value;
      const [w, h] = sizes[size][orient];
      const pagePxWidth = w * 3.7795;

      let scale = 1;
      if (z === "fit") {
        const canvasWidth = canvas.clientWidth - 40;
        scale = canvasWidth / pagePxWidth;
        scale = Math.min(Math.max(scale, 0.4), 1.2);
      } else {
        scale = parseFloat(z);
      }

      page.style.transform = `scale(${scale})`;
      page.style.transformOrigin = "top left";
      container.style.width = `${pagePxWidth * scale}px`;
      container.style.height = `${page.offsetHeight * scale}px`;
    }

    const PERSIST_PROFILE_FIELDS = [
      'instansi', 'tahun', 'mapel', 'fase', 'tempatTgl', 'kepsekNama', 'kepsekNIY', 'guruNama', 'guruNIY'
    ];

    function getProfileStorageKey(id) {
       const userEmail = (localStorage.getItem('hdl_user_email') || '').trim().toLowerCase();
       return userEmail ? `hdl_persisted_${userEmail}_${id}` : `hdl_persisted_${id}`;
    }

    function saveProfileFields() {
      try {
        PERSIST_PROFILE_FIELDS.forEach(id => {
          const el = document.getElementById(id);
          if (el) localStorage.setItem(getProfileStorageKey(id), el.value);
        });
      } catch (e) { }
    }

    function loadProfileFields() {
      try {
        PERSIST_PROFILE_FIELDS.forEach(id => {
          const val = localStorage.getItem(getProfileStorageKey(id));
          const el = document.getElementById(id);
          if (val !== null && el) el.value = val;
          if (el && !el.dataset.autosaveAttached) {
             el.addEventListener('input', saveProfileFields);
             el.dataset.autosaveAttached = 'true';
          }
        });
      } catch (e) { }
    }

    function checkLoginBadge() {
      try {
        const savedCode = localStorage.getItem('hdl_access_code') || '';
        const badge = document.getElementById('accountBadge');
        if (savedCode && badge) {
          badge.style.display = 'flex';
          const uName = localStorage.getItem('hdl_user_name') || 'Pengguna';
          const uEmail = localStorage.getItem('hdl_user_email') || '';
          const uPhoto = localStorage.getItem('hdl_user_photo') || '';
          const nameEl = document.getElementById('accountBadgeName');
          const emailEl = document.getElementById('accountBadgeEmail');
          const avatarInner = document.getElementById('accountBadgeAvatarInner');
          if (nameEl) nameEl.textContent = uName;
          if (emailEl) emailEl.textContent = uEmail;
          if (uPhoto && avatarInner) {
            avatarInner.innerHTML = '<img src="' + uPhoto + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
          } else if (avatarInner) {
            avatarInner.textContent = uName.charAt(0).toUpperCase();
          }
        }
      } catch (e) { }
    }

    function logoutGoogle() {
      localStorage.removeItem('hdl_access_code');
      window.location.href = 'index.html';
    }

    window.addEventListener('load', () => {
      loadProfileFields();
      checkLoginBadge();
      updatePageStyle();
      applyZoom();
      window.addEventListener('resize', applyZoom);
    });
  </script>
</body>

</html>
